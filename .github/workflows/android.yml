name: Build LMP Clock & Weather APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LMP_Clock_Weather_Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -q LMP_Clock_Weather_Project.zip -d .

      - name: Build debug APK
        run: gradle --no-daemon -p LMPClockWeather :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LMP-Clock-Weather-debug-APK
          path: LMPClockWeather/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
